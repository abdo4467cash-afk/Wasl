name: Build WASL Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Installable APK
        run: |
          if [ -f "settings.gradle.kts" ]; then
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ./WASL-v1.0.0.apk
          elif [ -f "WASL-Android/settings.gradle.kts" ]; then
            cd WASL-Android
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../WASL-v1.0.0.apk
          fi

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "WASL APK (Build #${{ github.run_number }})"
          files: WASL-v1.0.0.apk

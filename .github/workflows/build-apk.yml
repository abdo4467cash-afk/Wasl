name: Build WASL Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract, Patch Null-Safety, and Build APK
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/work_build"
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          echo "Found ZIP: $ZIP_FILE" > "$GITHUB_WORKSPACE/build_log.txt"
          unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/work_build" >> "$GITHUB_WORKSPACE/build_log.txt" 2>&1

          GRADLE_FILE=$(find "$GITHUB_WORKSPACE/work_build" -name "settings.gradle.kts" | head -n 1)
          BUILD_DIR=$(dirname "$GRADLE_FILE")
          cd "$BUILD_DIR"

          # Fix the 6 nullable receiver calls in BluetoothRfcommManager.kt & LanDiscoveryAndTransportManager.kt
          BT_FILE=$(find . -name "BluetoothRfcommManager.kt" | head -n 1)
          LAN_FILE=$(find . -name "LanDiscoveryAndTransportManager.kt" | head -n 1)

          sed -i 's/bluetoothAdapter\.cancelDiscovery()/bluetoothAdapter?.cancelDiscovery()/g' "$BT_FILE"
          sed -i 's/nsdManager\.registerService/nsdManager?.registerService/g' "$LAN_FILE"
          sed -i 's/nsdManager\.unregisterService/nsdManager?.unregisterService/g' "$LAN_FILE"
          sed -i 's/nsdManager\.resolveService/nsdManager?.resolveService/g' "$LAN_FILE"
          sed -i 's/nsdManager\.discoverServices/nsdManager?.discoverServices/g' "$LAN_FILE"
          sed -i 's/nsdManager\.stopServiceDiscovery/nsdManager?.stopServiceDiscovery/g' "$LAN_FILE"

          # Ensure clean themes.xml for AAPT2
          cat << 'XML' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Wasl" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">@color/wasl_ivory_bg</item>
                  <item name="android:navigationBarColor">@color/wasl_ivory_bg</item>
                  <item name="android:windowBackground">@color/wasl_ivory_bg</item>
              </style>
          </resources>
          XML

          # Use Gradle 8.6 specifically for full compatibility with AGP 8.3.2
          curl -sL https://services.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /tmp/gradle
          export PATH="/tmp/gradle/gradle-8.6/bin:$PATH"

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

          echo "=== Running gradle assembleDebug ===" >> "$GITHUB_WORKSPACE/build_log.txt"
          /tmp/gradle/gradle-8.6/bin/gradle assembleDebug --no-daemon --stacktrace >> "$GITHUB_WORKSPACE/build_log.txt" 2>&1

          APK_FOUND=$(find . -name "*-debug.apk" | head -n 1)
          if [ -n "$APK_FOUND" ]; then
            cp "$APK_FOUND" "$GITHUB_WORKSPACE/WASL-v1.0.0.apk"
            echo "SUCCESS: APK created at WASL-v1.0.0.apk" >> "$GITHUB_WORKSPACE/build_log.txt"
          else
            echo "FAILED: APK was not generated. Check errors above." >> "$GITHUB_WORKSPACE/build_log.txt"
          fi
          exit 0

      - name: Publish Release with APK and Build Log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "تطبيق وَصْل | WASL APK (Build #${{ github.run_number }})"
          files: |
            WASL-v1.0.0.apk
            build_log.txt

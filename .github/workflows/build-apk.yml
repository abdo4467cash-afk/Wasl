name: Build WASL Android APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Extract Project ZIP Anywhere
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          echo "Found ZIP at: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d ./extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Installable APK
        run: |
          GRADLE_FILE=$(find ./extracted_project -name "settings.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Building Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/WASL-v1.0.0.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WASL-Installable-APK
          path: WASL-v1.0.0.apk

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "تطبيق وَصْل | WASL APK (Build #${{ github.run_number }})"
          files: WASL-v1.0.0.apk
